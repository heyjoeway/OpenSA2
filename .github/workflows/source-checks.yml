name: Source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare the local test workspace
        run: mkdir -p private/generated
      - name: Check source and documentation
        run: python tools/public_check.py
      - name: Verify the public-source checks
        run: python -m unittest discover -s tools/tests -v
      - name: Test the installer and launcher with synthetic files
        run: python tools/test_source.py
