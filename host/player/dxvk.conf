# The DXVK configuration every player and smoke run pins through
# DXVK_CONFIG_FILE (host/player/player_env.sh), so that DXVK never picks up a
# stray ./dxvk.conf from whatever directory a run starts in
# (src/util/config/config.cpp:1751-1795 falls back to the current directory).
# player_env.sh also unsets DXVK_CONFIG, which DXVK would merge over this file.
#
# Every value below is either DXVK 3.1.1's default, written out so that a later
# change to a default cannot move a capture without this file saying so, or
# (floatEmulation) the value a driver-dependent default resolves to on this
# host, pinned so that another driver or GPU cannot change it silently. The
# player's report pins this file by sha256, and each capture keeps DXVK's own
# log of the options it read ("Effective configuration").

# Shader model 3: the game's shaders are vs_3_0 / ps_3_0 (d3d9_options.cpp:48).
d3d9.shaderModel = 3

# Float emulation decides what 0 * inf and 0 * NaN give in the game's shaders.
# Its default, auto, resolves to Strict only on drivers with the needed
# multiply semantics (NVIDIA 565.57.1 and later, RADV, NVK, AMDVLK 2.0.316 and
# later) and to Enabled everywhere else (d3d9_options.cpp:89-102). Strict is
# what this host resolves to (NVIDIA 595.91.7) and what DXVK's own Sonic
# Adventure 2 profile sets (config.cpp:544-548, which never matches on native).
d3d9.floatEmulation = Strict

# Half precision in the shaders: the default, False, written out, because its
# Auto mode would also follow the driver (d3d9_options.cpp:105-109).
d3d9.useFP16 = False

# The presentation interval comes from the player's own D3DPRESENT_PARAMETERS
# (IMMEDIATE for captures, ONE with --vsync); -1 leaves it to them.
d3d9.presentInterval = -1

# No frame limiter: pacing, when asked for, is the player's (--pace), by the
# recorded virtual time, not DXVK's.
d3d9.maxFrameRate = 0

# Frames in flight and the tear-free present mode: the defaults, written out.
# Neither changes a frame the player reads back (it reads before Present);
# both change when a presented frame reaches the screen.
d3d9.maxFrameLatency = 0
dxvk.tearFree = Auto
